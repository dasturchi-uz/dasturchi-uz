<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="354" viewBox="0 0 1200 354" role="img" aria-label="dasturchi-uz developer profile animated banner">
<title>dasturchi-uz — a space to build and explore</title>
<defs>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#087eca" stop-opacity=".22"/><stop offset="1" stop-color="#0b9d80" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#bfd0e4" stroke-opacity=".26" stroke-width="1"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#087eca"/><stop offset="1" stop-color="#0b9d80"/></linearGradient>
  <clipPath id="rounded"><rect width="1198" height="352" x="1" y="1" rx="23"/></clipPath>
  <style><![CDATA[
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif }
  .wave {stroke-dasharray:5 12;animation:dash 9s linear infinite}
  .pulse {animation:pulse 3.6s ease-in-out infinite;transform-origin:970px 179px}
  .pulse2 {animation:pulse 3.6s ease-in-out 1.2s infinite;transform-origin:970px 179px}
  .blink {animation:blink 1.1s steps(1) infinite}
  .float {animation:float 5s ease-in-out infinite}
  .subtle {animation:fade 4s ease-in-out infinite}
  @keyframes dash {to {stroke-dashoffset:-340}}
  @keyframes pulse {0%,100% {opacity:.25;transform:scale(.88)} 55% {opacity:.8;transform:scale(1.04)}}
  @keyframes blink {0%,49% {opacity:1} 50%,100% {opacity:0}}
  @keyframes float {0%,100% {transform:translateY(0)} 50% {transform:translateY(-6px)}}
  @keyframes fade {0%,100% {opacity:.42} 50% {opacity:.95}}
  @media (prefers-reduced-motion: reduce) {.wave,.pulse,.pulse2,.blink,.float,.subtle {animation:none}}
  ]]></style>
</defs>
<g clip-path="url(#rounded)">
<rect width="1200" height="354" fill="#f5f9ff"/>
<rect width="1200" height="354" fill="url(#grid)"/>
<circle cx="200" cy="-110" r="355" fill="url(#glow)"/>
<path d="M0 1H1200" stroke="url(#accent)" stroke-width="5"/>
<g opacity=".6"><path d="M721 31V323" stroke="#dae5f2"/><path d="M748 0V354" stroke="#dae5f2" stroke-dasharray="2 16"/></g>
<!-- identity block -->
<rect x="62" y="38" width="174" height="29" rx="14.5" fill="#ffffff" stroke="#dae5f2"/>
<circle cx="82" cy="52.5" r="4" fill="#0b9d80" class="subtle"/>
<text x="96" y="58" fill="#49627e" font-size="13" letter-spacing="1.35" class="mono">GITHUB / PROFILE</text>
<text x="62" y="164" fill="#121d31" font-size="69" font-weight="800" letter-spacing="-3" class="sans">dasturchi<tspan fill="#087eca">-uz</tspan></text>
<rect x="62" y="192" width="5" height="34" rx="2.5" fill="url(#accent)"/>
<text x="82" y="210" fill="#49627e" font-size="19" class="mono">A SPACE TO BUILD &amp; EXPLORE</text>
<text x="82" y="237" fill="#49627e" font-size="15" class="mono">ideas · experiments · progress</text>
<path d="M62 288H668" stroke="#dae5f2"/>
<text x="62" y="318" fill="#0b9d80" font-size="16" class="mono">&gt;_</text>
<text x="96" y="318" fill="#49627e" font-size="14" class="mono">keep learning, keep creating</text>
<rect x="365" y="305" width="8" height="15" fill="#087eca" class="blink"/>
<!-- right feature visual -->
<rect x="785" y="50" width="358" height="252" rx="20" fill="#ffffff" stroke="#dae5f2" stroke-width="1.5"/>
<path d="M785 99H1143" stroke="#dae5f2"/>
<circle cx="812" cy="74" r="6" fill="#ff6b77"/><circle cx="833" cy="74" r="6" fill="#ffd16f"/><circle cx="854" cy="74" r="6" fill="#0b9d80"/>
<text x="890" y="79" fill="#49627e" font-size="15" class="mono">workspace</text>
<g class="float">
  <path d="M857 197Q916 115 970 179Q1022 239 1085 151" stroke="url(#accent)" stroke-width="2.4" fill="none" opacity=".85"/>
  <path d="M857 197Q916 115 970 179Q1022 239 1085 151" stroke="#121d31" stroke-width="2.4" class="wave" fill="none"/>
  <circle cx="857" cy="197" r="11" fill="#ffffff" stroke="#0b9d80" stroke-width="3"/>
  <circle cx="970" cy="179" r="10" fill="#ffffff" stroke="#087eca" stroke-width="3"/>
  <circle cx="1085" cy="151" r="11" fill="#ffffff" stroke="#0b9d80" stroke-width="3"/>
</g>
<circle class="pulse" cx="970" cy="179" r="27" stroke="#087eca" fill="none" stroke-width="2" opacity=".5"/>
<circle class="pulse2" cx="970" cy="179" r="43" stroke="#087eca" fill="none" stroke-width="1.5" opacity=".35"/>
<text x="807" y="272" fill="#49627e" font-size="13" class="mono">write</text><text x="941" y="272" fill="#49627e" font-size="13" class="mono">iterate</text><text x="1064" y="272" fill="#49627e" font-size="13" class="mono">grow</text>
</g>
<rect x="1" y="1" width="1198" height="352" rx="23" stroke="#dae5f2" stroke-width="2" fill="none"/>
</svg>